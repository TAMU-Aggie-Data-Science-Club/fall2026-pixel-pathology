<div class="flow" id="flow">
  <div class="bar">
    <div class="bar-left"><span class="dot" aria-hidden="true"></span><span class="bar-title" id="barTitle"></span></div>
    <div class="seg" id="tabs" role="tablist" aria-label="Stages"></div>
  </div>
  <div class="body">
    <div class="canvas" id="canvas"></div>
    <aside class="side" id="side" aria-live="polite">
      <div class="kicker" id="kicker"></div>
      <h3 class="title" id="title"></h3>
      <p class="text" id="text"></p>
      <p class="text sub" id="text2"></p>
      <dl class="facts" id="facts"></dl>
    </aside>
  </div>
  <div class="foot">
    <div class="ctrls">
      <button class="btn primary" id="play" type="button">Play</button>
      <button class="btn" id="replay" type="button">Replay</button>
      <button class="btn icon" id="prev" type="button" aria-label="Previous stage">&larr;</button>
      <button class="btn icon" id="next" type="button" aria-label="Next stage">&rarr;</button>
    </div>
    <div class="prog" id="prog" role="group" aria-label="Progress"></div>
    <div class="tag" id="tag"></div>
  </div>
</div>
