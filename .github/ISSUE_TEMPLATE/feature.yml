name: Feature
description: A new capability or improvement to build
labels: [feature]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What are we building, and why?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes / dependencies
      description: Anything else worth knowing before someone picks this up.
